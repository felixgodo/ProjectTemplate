# nginx-Site ohne HestiaCP – setup.sh ersetzt @DOMAIN@ und @APP_PORT@.
# Nur HTTP: TLS danach z. B. mit `certbot --nginx -d @DOMAIN@` einrichten.
server {
    listen      80;
    server_name @DOMAIN@;
    root        /opt/projecttemplate/current/public_html;
    index       index.html;

    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass         http://127.0.0.1:@APP_PORT@;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Gehashte Build-Dateien dürfen lange gecacht werden
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: alle anderen Pfade liefern index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
