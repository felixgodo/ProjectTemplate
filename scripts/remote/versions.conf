# Versionen und Namen für den zweiten Rechner (setup-linux.sh, setup-mac.sh, migrate-beads.sh).
# bd und dolt müssen auf beiden Rechnern gleich sein: beide schreiben in dieselbe Datenbank.
# Auf dem Mac nachsehen: node -v, bd version, dolt version.
NODE_MAJOR=24
BD_VERSION=1.3.1
DOLT_VERSION=2.4.2
# Name des Linux-Rechners im Tailnet (tailscale up --hostname) und Port der gemeinsamen Dolt-Datenbank
PC_NAME=pc
DOLT_PORT=3307
# Nummern der Worker je Rechner: Mac fix-1 …, PC fix-101 …
MAC_HOST_BASE=0
PC_HOST_BASE=100
# Rollen, die `workers start` auf dem Mac ohne Angabe startet (verify/regress halten den
# Merge-Slot bzw. laufen lange: besser auf dem Rechner, der nicht schläft)
MAC_ROLES="fix search"
